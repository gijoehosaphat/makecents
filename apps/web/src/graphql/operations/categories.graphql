query GetCategories($accountId: Int!) {
  allCategories(filter: { accountId: { equalTo: $accountId } }) {
    nodes {
      ...CategoryFragment
    }
  }
}

mutation CreateCategory($accountId: Int!, $name: String) {
  createCategory(input: { category: { accountId: $accountId, name: $name } }) {
    category {
      ...CategoryFragment
    }
  }
}

mutation UpdateCategory($nodeId: ID!, $name: String, $kind: String) {
  updateCategory(input: { nodeId: $nodeId, categoryPatch: { name: $name, kind: $kind } }) {
    category {
      ...CategoryFragment
    }
  }
}

mutation DeleteCategoryById($id: Int!) {
  deleteCategoryById(input: { id: $id }) {
    deletedCategoryId
  }
}
