mutation UpsertBankAccount(
  $accountId: Int!
  $type: String!
  $subtype: String
  $currency: String!
  $bankAccountId: String!
) {
  upsertBankAccount(
    input: {
      bankAccount: {
        accountId: $accountId
        type: $type
        subtype: $subtype
        currency: $currency
        bankAccountId: $bankAccountId
      }
    }
  ) {
    bankAccount {
      ...BankAccountFragment
    }
  }
}

mutation UpsertBankAccountReconciliation($bankAccountId: Int!, $balance: BigInt!, $asOf: Datetime!) {
  upsertBankAccountReconciliation(
    input: { bankAccountReconciliation: { bankAccountId: $bankAccountId, balance: $balance, asOf: $asOf } }
  ) {
    bankAccountReconciliation {
      ...BankAccountReconciliationFragment
    }
  }
}

mutation UpdateBankAccountName($id: Int!, $accountId: Int!, $name: String!) {
  upsertBankAccount(input: { bankAccount: { name: $name, accountId: $accountId } }, where: { id: $id }) {
    bankAccount {
      ...BankAccountFragment
    }
  }
}

mutation UpdateBankAccountClosed($id: Int!, $accountId: Int!, $closed: Boolean!) {
  upsertBankAccount(input: { bankAccount: { closed: $closed, accountId: $accountId } }, where: { id: $id }) {
    bankAccount {
      ...BankAccountFragment
    }
  }
}

mutation UpdateBankAccountType($id: Int!, $accountId: Int!, $type: String!) {
  upsertBankAccount(input: { bankAccount: { type: $type, accountId: $accountId } }, where: { id: $id }) {
    bankAccount {
      ...BankAccountFragment
    }
  }
}

mutation UpdateBankAccountSubtype($id: Int!, $accountId: Int!, $subtype: String) {
  upsertBankAccount(input: { bankAccount: { subtype: $subtype, accountId: $accountId } }, where: { id: $id }) {
    bankAccount {
      ...BankAccountFragment
    }
  }
}

mutation ReorderBankAccounts($accountId: Int!, $bankAccountIds: [Int]!) {
  reorderBankAccounts(input: { accountId: $accountId, bankAccountIds: $bankAccountIds }) {
    bankAccounts {
      ...BankAccountFragment
    }
  }
}
