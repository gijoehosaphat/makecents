query GetUserAndAccountsAndBankAccountsByEmail($email: String!) {
  userByEmail(email: $email) {
    ...UserFragment
    accountMembersByUserId {
      nodes {
        role
        accountByAccountId {
          ...AccountFragment
          bankAccountsByAccountId {
            nodes {
              ...BankAccountFragment
            }
          }
        }
      }
    }
  }
}
