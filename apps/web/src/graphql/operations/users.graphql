query GetUserAndAccountsAndBankAccountsByEmail($email: String!) {
  userByEmail(email: $email) {
    ...UserFragment
    accountMembersByUserId {
      nodes {
        role
        accountByAccountId {
          ...AccountFragment
          bankAccountsByAccountId {
            nodes {
              ...BankAccountFragment
            }
          }
        }
      }
    }
  }
}

query GetAccountMembers($accountId: Int!) {
  allAccountMembers(condition: { accountId: $accountId }) {
    nodes {
      nodeId
      accountId
      userId
      role
      createdAt
      userByUserId {
        ...UserFragment
      }
    }
  }
}

mutation AddAccountUser($accountId: Int!, $email: String!, $password: String!, $name: String) {
  addAccountUser(input: { accountId: $accountId, email: $email, password: $password, name: $name }) {
    user {
      ...UserFragment
    }
  }
}

mutation RemoveAccountUser($accountId: Int!, $userId: Int!) {
  removeAccountUser(input: { accountId: $accountId, userId: $userId }) {
    boolean
  }
}
