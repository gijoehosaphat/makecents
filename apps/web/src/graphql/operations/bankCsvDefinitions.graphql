query GetBankCsvDefinitions($accountId: Int!) {
  allBankCsvDefinitions(filter: { accountId: { equalTo: $accountId } }) {
    nodes {
      ...BankCsvDefinitionFragment
    }
  }
}

mutation CreateBankCsvDefinition(
  $accountId: Int!
  $name: String!
  $fingerprint: String!
  $mapping: JSON!
  $bankAccountIds: [Int]!
) {
  createBankCsvDefinition(
    input: {
      bankCsvDefinition: {
        accountId: $accountId
        name: $name
        fingerprint: $fingerprint
        mapping: $mapping
        bankAccountIds: $bankAccountIds
      }
    }
  ) {
    bankCsvDefinition {
      ...BankCsvDefinitionFragment
    }
  }
}

mutation UpdateBankCsvDefinition(
  $nodeId: ID!
  $name: String
  $fingerprint: String
  $mapping: JSON
  $bankAccountIds: [Int]
) {
  updateBankCsvDefinition(
    input: {
      nodeId: $nodeId
      bankCsvDefinitionPatch: {
        name: $name
        fingerprint: $fingerprint
        mapping: $mapping
        bankAccountIds: $bankAccountIds
      }
    }
  ) {
    bankCsvDefinition {
      ...BankCsvDefinitionFragment
    }
  }
}

mutation DeleteBankCsvDefinitionById($id: Int!) {
  deleteBankCsvDefinitionById(input: { id: $id }) {
    deletedBankCsvDefinitionId
  }
}

query GetTransactionsForCsvAccountMatching($filter: TransactionFilter!, $deletedFilter: DeletedTransactionFilter!) {
  allTransactions(filter: $filter) {
    nodes {
      id
      bankAccountId
      bankTransactionId
      name
      amount
      originalAmount
      posted
      originalPosted
    }
  }
  # Deleted rows are skipped by imports, so the preview counts them as already there.
  allDeletedTransactions(filter: $deletedFilter) {
    nodes {
      bankAccountId
      bankTransactionId
    }
  }
}
