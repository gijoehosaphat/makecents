mutation UpsertTransaction(
  $type: String!
  $posted: Datetime!
  $name: String!
  $memo: String
  $bankTransactionId: String!
  $bankAccountId: Int!
  $amount: BigInt!
) {
  upsertTransaction(
    input: {
      transaction: {
        bankAccountId: $bankAccountId
        amount: $amount
        bankTransactionId: $bankTransactionId
        name: $name
        memo: $memo
        posted: $posted
        type: $type
      }
    }
  ) {
    transaction {
      ...TransactionFragment
    }
  }
}

mutation CreateTransaction(
  $amount: BigInt
  $bankAccountId: Int!
  $bankTransactionId: String
  $memo: String
  $name: String
  $originalAmount: BigInt
  $originalPosted: Datetime
  $posted: Datetime
  $splitSourceId: Int
  $type: String
) {
  createTransaction(
    input: {
      transaction: {
        bankAccountId: $bankAccountId
        amount: $amount
        splitSourceId: $splitSourceId
        bankTransactionId: $bankTransactionId
        memo: $memo
        name: $name
        originalAmount: $originalAmount
        originalPosted: $originalPosted
        posted: $posted
        type: $type
      }
    }
  ) {
    transaction {
      ...TransactionFragment
    }
  }
}

mutation UpdateTransaction(
  $nodeId: ID!
  $amount: BigInt
  $bankAccountId: Int
  $bankTransactionId: String
  $categoryId: Int
  $memo: String
  $name: String
  $originalAmount: BigInt
  $posted: Datetime
  $splitSourceId: Int
  $type: String
  $customMemo: String
  $customName: String
  $categorySource: String
) {
  updateTransaction(
    input: {
      nodeId: $nodeId
      transactionPatch: {
        amount: $amount
        bankAccountId: $bankAccountId
        bankTransactionId: $bankTransactionId
        categoryId: $categoryId
        memo: $memo
        name: $name
        originalAmount: $originalAmount
        posted: $posted
        splitSourceId: $splitSourceId
        type: $type
        customMemo: $customMemo
        customName: $customName
        categorySource: $categorySource
      }
    }
  ) {
    transaction {
      ...TransactionFragment
    }
  }
}

mutation DeleteTransaction($nodeId: ID!) {
  deleteTransaction(input: { nodeId: $nodeId }) {
    deletedTransactionId
  }
}

query TransactionSearch($match: String) {
  transactionSearch(match: $match) {
    nodes {
      ...TransactionFragment
      categoryByCategoryId {
        ...CategoryFragment
      }
    }
  }
}

query TransactionByAmount($amount: BigInt!) {
  allTransactions(
    filter: { amount: { equalTo: $amount } }
    orderBy: POSTED_DESC
  ) {
    nodes {
      ...TransactionFragment
    }
  }
}

mutation CreateTransfer(
  $transactionSourceId: Int!
  $transactionTargetId: Int!
) {
  createTransfer(
    input: {
      transfer: {
        transactionSourceId: $transactionSourceId
        transactionTargetId: $transactionTargetId
      }
    }
  ) {
    transfer {
      ...TransferFragment
    }
  }
}

mutation DeleteTransfer($nodeId: ID!) {
  deleteTransfer(input: { nodeId: $nodeId }) {
    transfer {
      ...TransferFragment
    }
  }
}

query GetTransfer($nodeId: ID!) {
  transfer(nodeId: $nodeId) {
    ...TransferFragment
    transactionByTransactionTargetId {
      ...TransactionFragment
    }
    transactionByTransactionSourceId {
      ...TransactionFragment
    }
  }
}

query GetTransactionAggregatesByBankAccount(
  $bankAccountIds: [Int!]
  $dateFrom: Datetime
  $dateTo: Datetime
  $transferFilter: TransactionFilter!
) {
  deposits: allTransactions(
    filter: {
      bankAccountId: { in: $bankAccountIds }
      posted: { greaterThanOrEqualTo: $dateFrom, lessThan: $dateTo }
      categoryId: { isNull: false }
      and: [$transferFilter]
      amount: { greaterThan: "0" }
    }
  ) {
    aggregates {
      sum {
        amount
      }
    }
  }
  withdrawals: allTransactions(
    filter: {
      bankAccountId: { in: $bankAccountIds }
      posted: { greaterThanOrEqualTo: $dateFrom, lessThan: $dateTo }
      categoryId: { isNull: false }
      and: [$transferFilter]
      amount: { lessThan: "0" }
    }
  ) {
    aggregates {
      sum {
        amount
      }
    }
  }
}

mutation UpsertSplitTransactions(
  $toUpdate: [TransactionPatch!]
  $toCreate: [TransactionInput!]
  $toDelete: [TransactionPatch!]
) {
  mnUpdateTransactionById(input: { mnTransactionPatch: $toUpdate }) {
    transaction {
      ...TransactionFragment
    }
  }
  mnCreateTransaction(input: { mnTransaction: $toCreate }) {
    transaction {
      ...TransactionFragment
    }
  }
  mnDeleteTransactionById(input: { mnTransactionPatch: $toDelete }) {
    transaction {
      ...TransactionFragment
    }
  }
}

query GetFilteredTransactionTotalsByBankAccounts($depositFilter: TransactionFilter!, $withdrawalFilter: TransactionFilter!) {
  deposits: allTransactions(filter: $depositFilter) {
    groupedAggregates(groupBy: BANK_ACCOUNT_ID) {
      keys
      sum {
        amount
      }
    }
  }
  withdrawals: allTransactions(filter: $withdrawalFilter) {
    groupedAggregates(groupBy: BANK_ACCOUNT_ID) {
      keys
      sum {
        amount
      }
    }
  }
}

query GetFilteredTransactionTotalsBySearch(
  $depositFilter: TransactionFilter!
  $withdrawalFilter: TransactionFilter!
  $match: String!
) {
  deposits: transactionSearch(filter: $depositFilter, match: $match) {
    groupedAggregates(groupBy: BANK_ACCOUNT_ID) {
      keys
      sum {
        amount
      }
    }
  }
  withdrawals: transactionSearch(filter: $withdrawalFilter, match: $match) {
    groupedAggregates(groupBy: BANK_ACCOUNT_ID) {
      keys
      sum {
        amount
      }
    }
  }
}

# Slim query for the daily cash flow chart: only the fields needed to bin by day, with transfers excluded
# in the database instead of fetching splits/transfers and filtering on the client.
query GetDailyCashFlowTransactions($filter: TransactionFilter!) {
  allTransactions(filter: $filter) {
    nodes {
      nodeId
      posted
      amount
    }
  }
}

# Per-category totals for the By Category report, summed in the database instead of fetching every transaction.
query GetCategoryTotals($filter: TransactionFilter!) {
  allTransactions(filter: $filter) {
    groupedAggregates(groupBy: CATEGORY_ID) {
      keys
      sum {
        amount
      }
    }
  }
}

# Row counts for the Search page tabs. Only totalCount is needed, so no rows are fetched.
query GetTransactionTabCounts(
  $allFilter: TransactionFilter!
  $uncategorizedFilter: TransactionFilter!
  $categorizedFilter: TransactionFilter!
) {
  all: allTransactions(first: 0, filter: $allFilter) {
    totalCount
  }
  uncategorized: allTransactions(first: 0, filter: $uncategorizedFilter) {
    totalCount
  }
  categorized: allTransactions(first: 0, filter: $categorizedFilter) {
    totalCount
  }
}

query GetTransactionTabCountsBySearch(
  $allFilter: TransactionFilter!
  $uncategorizedFilter: TransactionFilter!
  $categorizedFilter: TransactionFilter!
  $match: String!
) {
  all: transactionSearch(first: 0, filter: $allFilter, match: $match) {
    totalCount
  }
  uncategorized: transactionSearch(first: 0, filter: $uncategorizedFilter, match: $match) {
    totalCount
  }
  categorized: transactionSearch(first: 0, filter: $categorizedFilter, match: $match) {
    totalCount
  }
}
