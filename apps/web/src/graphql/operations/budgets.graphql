mutation CreateBudget(
  $accountId: Int!
  $amount: BigInt!
  $name: String!
  $startingAmount: BigInt
  $effectiveDate: Datetime
) {
  createBudget(
    input: {
      budget: {
        accountId: $accountId
        amount: $amount
        name: $name
        startingAmount: $startingAmount
        effectiveDate: $effectiveDate
      }
    }
  ) {
    budget {
      ...BudgetFragment
    }
  }
}

mutation UpdateBudget(
  $nodeId: ID!
  $amount: BigInt!
  $name: String!
  $startingAmount: BigInt
  $effectiveDate: Datetime
) {
  updateBudget(
    input: {
      nodeId: $nodeId
      budgetPatch: { amount: $amount, name: $name, startingAmount: $startingAmount, effectiveDate: $effectiveDate }
    }
  ) {
    budget {
      ...BudgetFragment
      budgetCategoriesByBudgetId {
        nodes {
          ...BudgetCategoryFragment
          categoryByCategoryId {
            ...CategoryFragment
          }
        }
      }
    }
  }
}

mutation CreateBudgetCategory($accountId: Int!, $budgetId: Int!, $categoryId: Int!) {
  createBudgetCategory(input: { budgetCategory: { accountId: $accountId, budgetId: $budgetId, categoryId: $categoryId } }) {
    budgetCategory {
      ...BudgetCategoryFragment
    }
  }
}

mutation DeleteBudget($nodeId: ID!) {
  deleteBudget(input: { nodeId: $nodeId }) {
    budget {
      ...BudgetFragment
    }
  }
}

mutation DeleteBudgetCategory($nodeId: ID!) {
  deleteBudgetCategory(input: { nodeId: $nodeId }) {
    budgetCategory {
      ...BudgetCategoryFragment
    }
  }
}

query GetBudgetsByAccountId($accountId: Int!) {
  allBudgets(filter: { accountId: { equalTo: $accountId } }) {
    nodes {
      ...BudgetFragment
      budgetCategoriesByBudgetId {
        nodes {
          ...BudgetCategoryFragment
          categoryByCategoryId {
            ...CategoryFragment
          }
        }
      }
    }
  }
}

query GetBudgetCategoriesByAccountId($accountId: Int!) {
  allBudgetCategories(filter: { accountId: { equalTo: $accountId } }) {
    nodes {
      ...BudgetCategoryFragment
      categoryByCategoryId {
        ...CategoryFragment
      }
    }
  }
}

query GetTransactionsGroupedByBudget($accountId: Int!) {
  allBudgets(filter: { accountId: { equalTo: $accountId } }) {
    nodes {
      ...BudgetFragment
      budgetCategoriesByBudgetId {
        nodes {
          ...BudgetCategoryFragment
          categoryByCategoryId {
            ...CategoryFragment
            transactionsByCategoryId {
              nodes {
                ...TransactionFragment
                transferCount
                categoryByCategoryId {
                  ...CategoryFragment
                }
              }
            }
          }
        }
      }
    }
  }
}

# Deposit and withdrawal totals for a period, leaving out transfers between the user's own accounts.
query GetBudgetPeriodTotals($bankAccountIds: [Int!], $dateFrom: Datetime!, $dateTo: Datetime!) {
  deposits: allTransactions(
    filter: {
      bankAccountId: { in: $bankAccountIds }
      posted: { greaterThanOrEqualTo: $dateFrom, lessThan: $dateTo }
      transferCount: { equalTo: "0" }
      amount: { greaterThan: "0" }
    }
  ) {
    aggregates {
      sum {
        amount
      }
    }
  }
  withdrawals: allTransactions(
    filter: {
      bankAccountId: { in: $bankAccountIds }
      posted: { greaterThanOrEqualTo: $dateFrom, lessThan: $dateTo }
      transferCount: { equalTo: "0" }
      amount: { lessThan: "0" }
    }
  ) {
    aggregates {
      sum {
        amount
      }
    }
  }
}

query GetPayrollTransactions($bankAccountIds: [Int!], $dateFrom: Datetime!, $dateTo: Datetime!) {
  allTransactions(
    filter: {
      bankAccountId: { in: $bankAccountIds }
      posted: { greaterThanOrEqualTo: $dateFrom, lessThan: $dateTo }
      categoryByCategoryId: { kind: { equalTo: "payroll" } }
    }
  ) {
    nodes {
      id
      categoryId
      amount
      posted
    }
  }
}
