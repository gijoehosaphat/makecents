mutation CreateBudget($accountId: Int!, $amount: BigInt!, $name: String!) {
  createBudget(input: { budget: { accountId: $accountId, amount: $amount, name: $name } }) {
    budget {
      ...BudgetFragment
    }
  }
}

mutation UpdateBudget($nodeId: ID!, $amount: BigInt!, $name: String!) {
  updateBudget(input: { nodeId: $nodeId, budgetPatch: { amount: $amount, name: $name } }) {
    budget {
      ...BudgetFragment
      budgetCategoriesByBudgetId {
        nodes {
          ...BudgetCategoryFragment
          categoryByCategoryId {
            ...CategoryFragment
          }
        }
      }
    }
  }
}

mutation CreateBudgetCategory($accountId: Int!, $budgetId: Int!, $categoryId: Int!) {
  createBudgetCategory(
    input: { budgetCategory: { accountId: $accountId, budgetId: $budgetId, categoryId: $categoryId } }
  ) {
    budgetCategory {
      ...BudgetCategoryFragment
    }
  }
}

mutation DeleteBudget($nodeId: ID!) {
  deleteBudget(input: { nodeId: $nodeId }) {
    budget {
      ...BudgetFragment
    }
  }
}

mutation DeleteBudgetCategory($nodeId: ID!) {
  deleteBudgetCategory(input: { nodeId: $nodeId }) {
    budgetCategory {
      ...BudgetCategoryFragment
    }
  }
}

query GetBudgetsByAccountId($accountId: Int!) {
  allBudgets(filter: { accountId: { equalTo: $accountId } }) {
    nodes {
      ...BudgetFragment
      budgetCategoriesByBudgetId {
        nodes {
          ...BudgetCategoryFragment
          categoryByCategoryId {
            ...CategoryFragment
          }
        }
      }
    }
  }
}

query GetBudgetCategoriesByAccountId($accountId: Int!) {
  allBudgetCategories(filter: { accountId: { equalTo: $accountId } }) {
    nodes {
      ...BudgetCategoryFragment
      categoryByCategoryId {
        ...CategoryFragment
      }
    }
  }
}

# Every withdrawal in the period (leaving out transfers), so spending that no budget accounts for can be found and fixed.
query GetPeriodWithdrawals($bankAccountIds: [Int!], $dateFrom: Datetime!, $dateTo: Datetime!) {
  allTransactions(
    filter: {
      bankAccountId: { in: $bankAccountIds }
      posted: { greaterThanOrEqualTo: $dateFrom, lessThan: $dateTo }
      transferCount: { equalTo: "0" }
      amount: { lessThan: "0" }
    }
    orderBy: POSTED_DESC
  ) {
    nodes {
      ...TransactionFragment
      categoryByCategoryId {
        ...CategoryFragment
      }
    }
  }
}

# Categorized deposits that are not payroll, offered as candidates when no payroll has been marked yet.
query GetPayrollCandidates($bankAccountIds: [Int!], $dateFrom: Datetime!, $dateTo: Datetime!) {
  allTransactions(
    filter: {
      bankAccountId: { in: $bankAccountIds }
      posted: { greaterThanOrEqualTo: $dateFrom, lessThan: $dateTo }
      transferCount: { equalTo: "0" }
      amount: { greaterThan: "0" }
      categoryByCategoryId: { isPayroll: { equalTo: false } }
    }
  ) {
    nodes {
      id
      amount
      categoryByCategoryId {
        ...CategoryFragment
      }
    }
  }
}

# Everything the envelope budget needs up to the selected month: the account's start, every budget with its
# categories, every assignment (later months included, since assigning ahead uses money now), and the monthly totals
# from the start month on. Months are local to $timeZone (the browser's), like the transaction lists' date filters.
query GetEnvelopeBudget($accountId: Int!, $throughMonth: Date!, $timeZone: String!) {
  accountById(id: $accountId) {
    ...EnvelopeStartFragment
  }
  allBudgets(filter: { accountId: { equalTo: $accountId } }) {
    nodes {
      ...BudgetFragment
      budgetCategoriesByBudgetId {
        nodes {
          ...BudgetCategoryFragment
          categoryByCategoryId {
            ...CategoryFragment
          }
        }
      }
    }
  }
  allBudgetAssignments(filter: { accountId: { equalTo: $accountId } }) {
    nodes {
      ...BudgetAssignmentFragment
    }
  }
  budgetMonthlyActivity(accountId: $accountId, toMonth: $throughMonth, timeZone: $timeZone) {
    nodes {
      budgetId
      month
      activity
    }
  }
  envelopeUnbudgetedMonthly(accountId: $accountId, toMonth: $throughMonth, timeZone: $timeZone) {
    nodes {
      month
      payroll
      unbudgetedInflow
      unbudgetedOutflow
    }
  }
}

# Moves money between two budgets for a month; a null budget is Ready to Assign.
mutation MoveBudgetMoney($accountId: Int!, $month: Date!, $fromBudgetId: Int, $toBudgetId: Int, $amount: BigInt!) {
  moveBudgetMoney(
    input: {
      accountId: $accountId
      month: $month
      fromBudgetId: $fromBudgetId
      toBudgetId: $toBudgetId
      amount: $amount
    }
  ) {
    budgetAssignments {
      ...BudgetAssignmentFragment
    }
  }
}

# Transactions in a budget's categories for a period, for reviewing and recategorizing its activity.
query GetBudgetTransactions($categoryIds: [Int!]!, $dateFrom: Datetime!, $dateTo: Datetime!) {
  allTransactions(
    filter: {
      categoryId: { in: $categoryIds }
      posted: { greaterThanOrEqualTo: $dateFrom, lessThan: $dateTo }
      transferCount: { equalTo: "0" }
    }
    orderBy: POSTED_DESC
  ) {
    nodes {
      ...TransactionFragment
      categoryByCategoryId {
        ...CategoryFragment
      }
    }
  }
}

# Where Ready to Assign starts: the start month, the balance the account was converted with, and the cash on hand
# entered for the start (which replaces that balance once set).
query GetEnvelopeStart($accountId: Int!) {
  accountById(id: $accountId) {
    ...EnvelopeStartFragment
  }
}

# Null clears it, going back to the converted starting balance.
mutation SetEnvelopeCashOnHand($accountId: Int!, $cashOnHand: BigInt) {
  setEnvelopeCashOnHand(input: { accountId: $accountId, cashOnHand: $cashOnHand }) {
    account {
      ...EnvelopeStartFragment
    }
  }
}
